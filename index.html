<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101114" />
    <meta
      name="description"
      content="Visualisation interactive d'une reconstruction 3D Gaussian Splat."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101114'/%3E%3Ccircle cx='11' cy='12' r='5' fill='%23ff6a2a'/%3E%3Ccircle cx='21' cy='11' r='3' fill='%23f1f3f5'/%3E%3Ccircle cx='19' cy='21' r='6' fill='%2378d5c4'/%3E%3C/svg%3E"
    />
    <title>Appartement 3D</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <main class="viewer-shell" id="viewerShell">
      <header class="toolbar">
        <div class="identity">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>Appartement 3D</h1>
            <p id="statusText" aria-live="polite">Chargement de la reconstruction...</p>
          </div>
        </div>

        <div class="toolbar-actions">
          <button class="view-button" id="copyViewButton" type="button">Copier la vue</button>
          <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="Afficher en plein écran">
            <span aria-hidden="true">⛶</span>
            <span class="button-label">Plein écran</span>
          </button>
        </div>
      </header>

      <section class="viewport" aria-label="Visualisation 3D interactive">
        <iframe
          id="splatViewer"
          src="/viewer/index.html?lang=fr&amp;noanim=1"
          title="Reconstruction Gaussian Splat de l'appartement"
          allow="fullscreen; xr-spatial-tracking"
        ></iframe>

        <div class="startup" id="startup" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span>Préparation du viewer</span>
        </div>

        <div class="error-panel" id="errorPanel" role="alert" hidden>
          <strong>Impossible de charger la reconstruction</strong>
          <p id="errorMessage">Vérifiez le fichier puis réessayez.</p>
          <button id="retryButton" type="button">Réessayer</button>
        </div>
      </section>
    </main>
  </body>
</html>
